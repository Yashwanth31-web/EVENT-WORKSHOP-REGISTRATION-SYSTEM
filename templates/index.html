<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campusly — Event Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 30px;
      background: #f1f5f9;
      color: #172033;
    }
    header, section {
      max-width: 850px;
      margin: 0 auto 20px;
    }
    header {
      background: #172554;
      color: white;
      padding: 24px;
      border-radius: 14px;
    }
    .card {
      background: white;
      padding: 20px;
      margin: 14px 0;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0001;
    }
    button {
      background: #2563eb;
      color: white;
      border: 0;
      padding: 10px 16px;
      border-radius: 7px;
      cursor: pointer;
    }
    input {
      padding: 10px;
      margin: 6px 0;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>Campusly</h1>
    <p>Event & Workshop Registration System</p>
  </header>

  <section>
    <div class="card">
      <h2>Welcome to Campusly</h2>
      <p>Explore campus events and register for workshops.</p>
      <a href="/my-registrations">My Registrations</a>
    </div>

    <div class="card">
      <h2>Find Events</h2>
      <p>Available events will appear here once connected to the backend.</p>
    </div>
  </section>
</body>
</html>
